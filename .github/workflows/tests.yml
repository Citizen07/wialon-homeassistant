name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported release, matching hacs.json "homeassistant".
          - ha: "2026.3"
            phcc: "pytest-homeassistant-custom-component==0.13.320"
          # Current release, as pinned in requirements_test.txt.
          - ha: "current"
            phcc: "-r requirements_test.txt"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ${{ matrix.phcc }}
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          # The tail goes to the job summary, which is readable without signing in.
          pytest -v -rfE 2>&1 | tee pytest.log || status=$?
          { echo '```'; tail -n 80 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}
